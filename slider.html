<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slider</title>
</head>
<body>
    <section>
  <img class="mySlides" src="https://tse2.mm.bing.net/th/id/OIP.fTKBoUZNRZVOxX9CaLd2rAHaEK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" style="height:500px; width:1340px;">
  <img class="mySlides" src="https://cdn.pixabay.com/photo/2022/10/28/08/23/very-cute-boy-handsome-boy-images-7552585_1280.jpg" style="height:500px; width:1340px;">
  <img class="mySlides" src="https://tse2.mm.bing.net/th/id/OIP.be0MIqTeq9Ic-tBki76ZDwHaE7?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" style="height:500px; width:1340px;">
</section>

<script>
// Automatic Slideshow - change image every 3 seconds
var myIndex = 0;
carousel();

function carousel() {
  var i;
  var x = document.getElementsByClassName("mySlides");
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";
  }
  myIndex++;
  if (myIndex > x.length) {myIndex = 1}
  x[myIndex-1].style.display = "block";
  setTimeout(carousel, 3000);
}
</script>

</body>
</html>
